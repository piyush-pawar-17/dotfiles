$font = GeistMono Nerd Font

background {
    monitor =
    path = /home/piyush/Pictures/Wallpapers/nice-blue-background.png
    color = rgba(1e1e2eff)
}

label {
    monitor =
    text = $TIME
    color = rgba(cdd6f4ff)
    font_size = 72
    font_family = $font
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(bac2deff)
    font_size = 20
    font_family = $font
    position = 0, 200
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(cba6f7ff)
    inner_color = rgba(313244ff)
    font_color = rgba(cdd6f4ff)
    font_family = $font
    fade_on_empty = false
    placeholder_text = Password...
    hide_input = false
    position = 0, -30
    halign = center
    valign = center
}
